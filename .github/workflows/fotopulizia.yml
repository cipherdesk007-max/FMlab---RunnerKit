name: pulizia-foto

on:
  push:
    branches: [main]
    paths: ["fotopulizia/**", ".github/workflows/fotopulizia.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulizia-foto
  cancel-in-progress: true

jobs:
  ipa:
    # compilata su Linux con Theos: i Mac di GitHub restano spesso in coda
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Theos, toolchain Swift per iOS e SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot rsync curl perl git libxml2 libz3-dev libtinfo6 zip unzip >/dev/null
          git clone --quiet --recursive --depth 1 https://github.com/theos/theos "$HOME/theos"
          curl -sL https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu20.04.tar.xz | tar -xJf - -C "$HOME/theos/toolchain/"
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          mv /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          ls "$HOME/theos/toolchain/linux/iphone/bin" | head
      - name: Compila
        run: |
          cd fotopulizia/theos
          mkdir -p Sources && cp ../Sorgenti/*.swift Sources/
          V=$(tr -d '[:space:]' < ../VERSIONE)
          sed -i "s/@VERSIONE@/$V/; s/@BUILD@/${GITHUB_RUN_NUMBER}/" Resources/Info.plist
          sed -i "s/^Version: .*/Version: $V/" control
          make package FINALPACKAGE=1 messages=yes 2>&1 | tail -60
          ls -l packages/
          cp packages/*.ipa ../FMlab-PuliziaFoto.ipa
          unzip -l ../FMlab-PuliziaFoto.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FMlab-PuliziaFoto
          path: fotopulizia/FMlab-PuliziaFoto.ipa
      - name: Pubblica il download (sempre allo stesso indirizzo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pulizia-foto --yes --cleanup-tag 2>/dev/null || true
          gh release create pulizia-foto fotopulizia/FMlab-PuliziaFoto.ipa --target "$GITHUB_SHA" \
            --title "FMlab Pulizia $(tr -d '[:space:]' < fotopulizia/VERSIONE)" \
            --notes "App per iPhone: pulizia di foto e video (video grandi, doppioni, screenshot, registrazioni, raffiche) e stato del telefono (batteria, temperatura, spazio). Si installa in LiveContainer: + in alto a destra, poi scegli il file .ipa. Tutto resta sul telefono; ogni cancellazione va in Eliminati di recente."
