name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touchpad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk python3-xlib imagemagick fonts-dejavu-core
      - name: Sintassi
        run: |
          /usr/bin/python3 -m py_compile touchpad/touchpad.py
          sh -n install.sh
          sh -n unavolta/unavolta
          sh -n pulizia/pulizia
          sh -n runnerboost/runnerboost
          bash -n terminale/terminale.sh
      - name: Test RunnerBoost + Terminale
        run: sh tests/test_boost_terminale.sh
      - name: Test Pulizia
        run: sh tests/test_pulizia.sh
      - name: Test UnaVolta
        run: sh tests/test_unavolta.sh
      - name: Test motore X11
        run: xvfb-run -a -s "-screen 0 1280x720x24" /usr/bin/python3 tests/test_x11.py
      - name: Test finestra + screenshot
        run: xvfb-run -a -s "-screen 0 1280x720x24" /usr/bin/python3 tests/test_gui.py
      - name: Salva screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/ci/
      - name: Pubblica screenshot nel repo
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p screenshots/ultima-versione
          cp screenshots/ci/*.png screenshots/ultima-versione/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f screenshots/ultima-versione
          git diff --cached --quiet || git commit -m "Screenshot automatici dei test [skip ci]"
          git push
