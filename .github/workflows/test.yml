name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# un push nuovo annulla il giro vecchio: "stabile" non torna mai indietro a una versione precedente
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  touchpad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk python3-xlib imagemagick fonts-dejavu-core mesa-utils x11-utils curl
      - name: Sintassi
        run: |
          /usr/bin/python3 -m py_compile touchpad/touchpad.py
          sh -n install.sh
          ! git ls-files | grep -q __pycache__
          sh -n unavolta/unavolta
          sh -n pulizia/pulizia
          for f in strumenti/*; do case "$(head -1 "$f")" in *python*) /usr/bin/python3 -m py_compile "$f";; *bash*) bash -n "$f";; *) sh -n "$f";; esac; done
          sh -n runnerboost/runnerboost
          bash -n terminale/terminale.sh
      - name: Test RunnerBoost + Terminale
        run: sh tests/test_boost_terminale.sh
      - name: Prova GPU (software in CI)
        run: xvfb-run -a -s "-screen 0 1280x720x24" sh -c 'RB_HOME=$(mktemp -d) runnerboost/runnerboost --gpu' 
      - name: Test Aggiorna
        run: sh tests/test_aggiorna.sh
      - name: Test Backup + Italiano + Collaudo
        run: sh tests/test_strumenti.sh
      - name: Test Pulizia
        run: sh tests/test_pulizia.sh
      - name: Test UnaVolta
        run: sh tests/test_unavolta.sh
      - name: Test installatore completo (installa, aggiorna, file rovinato, disinstalla)
        run: sh tests/test_installa.sh
      - name: Test motore X11
        run: xvfb-run -a -s "-screen 0 1280x720x24" /usr/bin/python3 tests/test_x11.py
      - name: Test Centro RunnerKit + screenshot
        run: xvfb-run -a -s "-screen 0 960x540x24" /usr/bin/python3 tests/test_centro.py
      - name: Test finestra + screenshot
        run: xvfb-run -a -s "-screen 0 1280x720x24" /usr/bin/python3 tests/test_gui.py
      - name: Salva screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/ci/
      - name: Pubblica screenshot nel repo
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p screenshots/ultima-versione
          cp screenshots/ci/*.png screenshots/ultima-versione/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f screenshots/ultima-versione
          git diff --cached --quiet || git commit -m "Screenshot automatici dei test [skip ci]"
          git push || echo "screenshot non pubblicati (main e' andato avanti): li pubblica il prossimo giro"
      - name: Promuovi a "stabile" (i telefoni installano e si aggiornano solo da qui)
        if: success() && github.ref == 'refs/heads/main'
        run: git push --force origin ${{ github.sha }}:refs/heads/stabile
